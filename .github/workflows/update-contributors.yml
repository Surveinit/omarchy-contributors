name: Update contributors

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update contributor data
        run: ./scripts/update-contributors.sh

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/contributors.json; then
            echo "Contributor data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributors.json
          git commit -m "chore: update contributor data"
          git push
